[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["nacleaver", "core", "modules"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 45

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"core/recon.py" = ["E402"]
