name: quality-and-security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked runtime and development tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock
      - name: Dependency consistency
        run: python -m pip check
      - name: Compile
        run: python -m compileall -q nacleaver.py core data modules tests
      - name: Lint
        run: ruff check .
      - name: Unit tests and coverage
        run: pytest --cov --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install audit tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock
      - name: Static security scan
        run: bandit -q -r nacleaver.py core modules
      - name: Dependency vulnerability scan
        run: |
          pip-audit -r requirements.lock
          pip-audit -r requirements-dev.lock
